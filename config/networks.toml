#:schema ./networks.schema.json
# Lafiya - Network Configuration
# This file centralizes public network parameters and contract IDs.
# NEVER store private keys, mnemonics, or secrets here.
# Only public identifiers: RPC URLs, passphrases, contract IDs.
#
# Usage:
#   - Deploy script: ./scripts/deploy.sh --network testnet
#   - Admin CLI (bash): ./scripts/admin.sh --network testnet <command>
#   - Admin CLI (rust): cargo run -p lafiya-cli -- --network testnet <command>
#
# Optional per network: rpc_urls = ["<primary>", "<secondary>", ...] lists RPC
# endpoints in failover order for lafiya-cli; it falls back to rpc_url when unset.
#
# Contract IDs are empty until deployed. After deployment, update the relevant
# network section with the deployed contract IDs.
#
# Named profiles (lafiya-cli profile use <name>) select a network section by
# name. Each profile records the network it targets, its risk tier, and the
# deployment ledger used to cross-check contract IDs before signing. A profile
# whose contract IDs do not belong to its network is refused.
#
# Profile fields:
#   network      - network section this profile targets (must exist above)
#   risk         - "low" | "elevated" | "mainnet"; mainnet mutations require
#                  explicit confirmation (typed network name or
#                  --confirm-network mainnet) and, when stdout is not a TTY,
#                  --yes-i-know-this-is-mainnet
#   deployment   - path to the deployment ledger used for contract-ID
#                  cross-checking (relative to the repository root)
#   description  - human readable summary shown in the profile banner

[profiles.local]
network = "local"
risk = "low"
deployment = "deployments/local.json"
description = "Local development network (stellar/quickstart)"

[profiles.testnet]
network = "testnet"
risk = "elevated"
deployment = "deployments/testnet.json"
description = "SDF public testnet"

[profiles.mainnet]
network = "mainnet"
risk = "mainnet"
deployment = "deployments/mainnet.json"
description = "Public Stellar mainnet - real funds, requires audit"

[local]
rpc_url = "http://localhost:8000/soroban/rpc"
network_passphrase = "Standalone Network ; February 2017"
# Local network is for development with stellar/quickstart

[local.contracts]
attester_registry = ""
attestation_registry = ""
incentive_pool = ""

[standalone]
rpc_url = "http://localhost:8000/soroban/rpc"
network_passphrase = "Standalone Network ; February 2017"

[standalone.contracts]
attester_registry = ""
attestation_registry = ""
incentive_pool = ""

[testnet]
rpc_url = "https://soroban-testnet.stellar.org"
network_passphrase = "Test SDF Network ; September 2015"
# SDF Public Testnet
# Testnet contract IDs are rewritten automatically after an SDF testnet reset;
# see docs/runbooks/testnet-reset.md.

[testnet.contracts]
attester_registry = ""
attestation_registry = ""
incentive_pool = ""

[futurenet]
rpc_url = "https://rpc-futurenet.stellar.org"
network_passphrase = "Test SDF Future Network ; October 2022"
# SDF Futurenet - for testing upcoming protocol changes

[futurenet.contracts]
attester_registry = ""
attestation_registry = ""
incentive_pool = ""

[mainnet]
rpc_url = "https://mainnet.sorobanrpc.com"
network_passphrase = "Public Global Stellar Network ; September 2015"
# WARNING: Mainnet - real funds. Requires audit.

[mainnet.contracts]
attester_registry = ""
attestation_registry = ""
incentive_pool = ""
