repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: check-yaml
        name: check YAML syntax (workflows, configs)
-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
    -   id: gitleaks
        name: gitleaks (secrets, incl. Stellar seeds via .gitleaks.toml)
-   repo: local
    hooks:
    -   id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
    -   id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
    -   id: check-readme-contracts
        name: check README contract tables
        entry: python .github/scripts/check_readme_contracts.py
        language: system
        pass_filenames: false
