# Each scenario injects one fault; the probe must fail closed (exit 2) or, for
# benign faults, finish. Add a fault: see README.md.

[[scenario]]
name = "none"
command = ["python3", "sandbox/chaos/probe.py", "{rpc_url}"]
expect_exit = 0
expect_output = ["synced"]

[[scenario]]
name = "latency"
fault = "latency"
command = ["python3", "sandbox/chaos/probe.py", "{rpc_url}"]
expect_exit = 0
expect_output = ["synced"]

