<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="t">
  <title id="t">CAUTION verdict screen</title>
  <rect width="360" height="240" fill="#ffffff"/>
  <rect x="16" y="16" width="328" height="120" rx="12" fill="#5c3b00"/>
  <text x="40" y="92" font-family="sans-serif" font-size="56" fill="#ffffff" aria-hidden="true">⚠</text>
  <text x="110" y="92" font-family="sans-serif" font-size="32" font-weight="700" fill="#ffffff">CAUTION</text>
