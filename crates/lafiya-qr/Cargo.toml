[package]
name = "lafiya-qr"
version = "0.1.0"
edition = "2021"
description = "Lafiya QR payload v1 encoder/decoder — compact, versioned, network-scoped card reference"
license = "MIT"
repository = "https://github.com/Lafiya-xyz/Lafiya-contract"

[features]
default = []
# Enables the physical robustness harness (synthetic degradation pipeline).
# Kept optional so the core encoder/decoder stays dependency-light.
robustness = ["dep:rqrr", "dep:rand", "dep:rand_chacha", "dep:image", "dep:jpeg-decoder"]

[dependencies]
sha2 = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
