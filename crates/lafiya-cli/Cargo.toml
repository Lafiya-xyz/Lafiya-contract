[package]
name = "lafiya-cli"
version = "0.1.0"
edition = "2021"
description = "Lafiya admin CLI - interacts with Soroban contracts using config/networks.toml"
license = "MIT"
repository = "https://github.com/Lafiya-xyz/Lafiya-contract"

[[bin]]
name = "lafiya-cli"
path = "src/main.rs"

[dependencies]
lafiya-config = { path = "../lafiya-config" }
lafiya-rpc-resilience = { path = "../lafiya-rpc-resilience" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
anyhow = "1.0"
serde_json = "1.0"
stellar-xdr = { version = "27.0.0", default-features = false, features = ["std", "base64"] }
ureq = "3"

[dev-dependencies]
tempfile = "3.10"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
