[package]
name = "lafiya-cli"
version = "0.1.0"
edition = "2021"
description = "Lafiya admin CLI - interacts with Soroban contracts via native RPC or stellar CLI fallback"
license = "MIT"
repository = "https://github.com/Lafiya-xyz/Lafiya-contract"

[[bin]]
name = "lafiya-cli"
path = "src/main.rs"

[dependencies]
lafiya-config = { path = "../lafiya-config" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
anyhow = "1.0"
# TODO(#395): Add once the native Soroban RPC client transport is wired up:
#   stellar-xdr = { version = "...", features = ["curr"] }  # XDR builder + decoder
#   reqwest      = { version = "0.12", features = ["blocking", "json"] }  # HTTP client
#   or evaluate stellar-rpc-client from SDF vs. thin in-house client

[dev-dependencies]
tempfile = "3.10"
