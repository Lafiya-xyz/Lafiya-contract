[package]
name = "lafiya-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Resource-usage harness that measures built contract wasm (docs/benchmarks.md)"
publish = false

[[bin]]
name = "lafiya-bench"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
soroban-sdk = { workspace = true, features = ["testutils"] }
