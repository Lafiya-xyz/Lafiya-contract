[package]
name = "lafiya-commitment"
version = "0.1.0"
edition = "2021"
description = "Reference implementation of the Lafiya Record Commitment (LRC-1) canonicalization and domain-separated hashing scheme"
license = "MIT"
repository = "https://github.com/Lafiya-xyz/Lafiya-contract"

[features]
# Enable the LRC-2 per-field selective-disclosure prototype (see ADR-0012).
lrc2 = []
std = []
soroban = ["dep:soroban-sdk"]

[dependencies]
sha2 = "0.10"
soroban-sdk = { workspace = true, optional = true }

[dev-dependencies]
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
