[package]
name = "lafiya-watchdog"
version = "0.1.0"
edition = "2021"
description = "Real-time security watchdog for privileged Lafiya contract events"
license = "MIT"
repository = "https://github.com/Lafiya-xyz/Lafiya-contract"

[[bin]]
name = "lafiya-watchdog"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
stellar-xdr = { version = "27.0.0", features = ["std", "base64"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3.10"
