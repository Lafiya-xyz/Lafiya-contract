[package]
name = "lafiya-rpc-resilience"
version = "0.1.0"
edition = "2021"
description = "Prototype: multi-provider RPC failover, retry classification, and transaction-recovery polling for Soroban submissions (ADR-0011)"
license = "MIT"
repository = "https://github.com/Lafiya-xyz/Lafiya-contract"

[dependencies]
tracing = "0.1"
serde_json = "1.0"
stellar-xdr = { version = "28.0.0", default-features = false, features = ["std", "base64"] }
rustls = { version = "0.23", default-features = false }
ureq = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
