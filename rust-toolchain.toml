# Pinned to an exact release so wasm builds are bit-for-bit reproducible
# (docs/releasing.md#reproducible-builds). Bump deliberately via the
# `rust-toolchain` Dependabot rule, never by editing to a moving channel.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = ["wasm32v1-none"]
profile = "minimal"
