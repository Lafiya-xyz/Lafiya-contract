# Link checking for the Markdown docs (`docs.yml`, "Docs quality gates").
# URLs or patterns that are known-good but unreachable from CI go in
# `.lycheeignore` (one regex per line), not here.
exclude_path = ["target", "node_modules", "CHANGELOG.md"]
exclude_all_private = true
include_fragments = false
accept = ["200..=299", "429"]
max_retries = 3
timeout = 20
