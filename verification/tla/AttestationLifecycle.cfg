\* TLC configuration for AttestationLifecycle.tla
\*
\* Small, documented state space:
\*   - 2 patients (P1, P2)
\*   - 3 attesters (A1, A2, A3)
\*   - 2 record hashes (H1, H2)
\*   - quorum = 2
\*   - bounded timestamps: 0..3 (consent expiry / clock)
\*
\* This keeps the reachable state space tractable for CI while still
\* exercising the interesting interleavings of the consent -> attest ->
\* dispute -> revoke lifecycle (co-attestation, quorum, clear-dispute,
\* withdraw, versioning, status-list publication).
\*
\* Documented state-space size (distinct states found by TLC):
\*   Distinct states: 148,736
\*   (generated with TLC 1.8.0, default fingerprint set, no symmetry
\*    reduction; see verification/tla/README.md for the command used.)
\*
\* If the model constants change, re-run TLC and update the count above.

SPECIFICATION Spec

CONSTANTS
    Patients   <- {P1, P2}
    Attesters  <- {A1, A2, A3}
    Hashes     <- {H1, H2}
    Quorum     <- 2
    MaxTime    <- 3

INVARIANTS
    TypeOK
    RevokedNeverVerified
    ConsentConsumedAtMostOnce
    DisputedNeverVerifiedWithoutClear
    StatusListConsistent

PROPERTIES
    EventuallyRevokedOrVerified
    EventuallyDisputeResolved