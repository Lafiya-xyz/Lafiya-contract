\* Models the contracts as implemented; upgrades never roll the schema back
\* (roll-forward rule in docs/runbooks/contract-upgrade.md section 6).
CONSTANTS
    Accounts = {a1, a2, a3}
    Signers = {a1, a2}
    InitAdmin = a1
    Registries = {attester, attestation}
    Upgradable = {attester}
    MaxSchema = 3
    AllowRollback = FALSE
    NoAccount = NoAccount

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AdminAlwaysCanSign
    NoStaleProposal
    UnpauseAlwaysEnabled
    MigrateAlwaysEnabled
    StoredSchemaNotAhead

PROPERTIES
    EventuallyUnpaused
    EventuallyMigrated
