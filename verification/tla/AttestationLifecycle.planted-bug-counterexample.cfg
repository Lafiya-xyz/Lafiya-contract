\* Counterexample configuration for AttestationLifecycle.tla.
\*
\* This configuration deliberately enables the planted specification bug
\* (PlantBug = TRUE) so that TLC finds a violation of the safety invariant
\* NoVerifiedAfterRevoke (a revoked record must never be "verified").
\*
\* The file name ends in "-counterexample.cfg" so that verification/tla/run.sh
\* treats a TLC violation as the expected outcome for this configuration.
\*
\* Expected result: TLC reports an invariant violation of NoVerifiedAfterRevoke
\* and exits with a non-zero status; run.sh inverts that into a pass.

SPECIFICATION Spec

CONSTANTS
    Records = {r1, r2}
    Patients = {p1}
    Providers = {d1, d2}
    Quorum = 2
    MaxVersion = 2

INVARIANTS
    NoVerifiedAfterRevoke
    NoVerifiedWhileDisputed
    ConsentConsumedAtMostOnce

\* Enable the planted bug: the Next relation contains an action that
\* transitions a revoked record directly to Verified, which must be caught
\* by NoVerifiedAfterRevoke.
CONSTANT PlantBug = TRUE

CHECK_DEADLOCK FALSE