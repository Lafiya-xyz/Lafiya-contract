\* Expected to FAIL: `upgrade` accepts any Wasm hash, so installing an older
\* build leaves storage ahead of the code reading it (see README "Findings").
CONSTANTS
    Accounts = {a1, a2}
    Signers = {a1}
    InitAdmin = a1
    Registries = {attester}
    Upgradable = {attester}
    MaxSchema = 2
    AllowRollback = TRUE
    NoAccount = NoAccount

INIT Init
NEXT Next

INVARIANTS
    StoredSchemaNotAhead
