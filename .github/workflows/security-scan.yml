name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    name: Semgrep (Soroban rules)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.178.0
      - name: Rule tests
        run: semgrep --test --config .semgrep/soroban.yml .semgrep/soroban.rs
      - name: Scan contracts
        run: semgrep scan --metrics=off --config .semgrep/soroban.yml --sarif --output semgrep.sarif --error contracts/
      - if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned + checksum)
        env:
          GL_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          GL_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL "$GL_URL" -o gitleaks.tar.gz
          echo "$GL_SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan history
        run: ./gitleaks git --config .gitleaks.toml --redact --report-format sarif --report-path gitleaks.sarif .
      - if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  sbom-vex:
    name: SBOM + VEX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32v1-none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.lock
      - uses: taiki-e/install-action@cargo-audit
      - uses: anchore/sbom-action/download-syft@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          syft-version: v1.53.0
      - name: Generate SBOMs
        run: |
          python3 scripts/generate_sboms.py -o sbom
          for pkg in packages/*/; do
            name=$(basename "$pkg")
            syft scan "dir:$pkg" --source-name "$name" -o "cyclonedx-json@1.6=sbom/npm-$name.sbom.cdx.json"
          done
      # cargo audit exits non-zero on any advisory; the VEX check below is the
      # gate, so its JSON report is captured either way.
      - run: cargo audit --json > audit.json || true
      - name: Validate SBOMs against CycloneDX 1.6 and VEX against advisories
        run: >-
          python3 scripts/validate_sboms.py
          --vex security/vex/vex.cdx.json
          --audit-json audit.json
          sbom/*.sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
