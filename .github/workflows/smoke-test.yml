name: Smoke Test

# Secrets are never accepted as workflow inputs (dispatch inputs are stored in
# the run's event payload). The admin key comes from the `testnet` GitHub
# Environment secret TESTNET_DEPLOYER_SECRET; see docs/runbooks/testnet-deployment.md.
on:
  workflow_call:
    inputs:
      att_registry:
        required: true
        type: string
      attester_registry:
        required: true
        type: string
      network_url:
        required: true
        type: string
    secrets:
      TESTNET_DEPLOYER_SECRET:
        required: false
  workflow_dispatch:
    inputs:
      att_registry:
        description: 'Attestation Registry contract ID'
        required: true
        type: string
      attester_registry:
        description: 'Attester Registry contract ID'
        required: true
        type: string
      network_url:
        description: 'Horizon URL for the target testnet'
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate network_url input
        env:
          NETWORK_URL: ${{ inputs.network_url }}
        run: |
          if ! grep -Fq "\"$NETWORK_URL\"" <(grep '^rpc_url' config/networks.toml); then
            echo "::error::network_url '$NETWORK_URL' does not match any rpc_url defined in config/networks.toml"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # stellar-cli has no maintained GitHub Action or crates.io-published install
      # path for a pinned release, so we pull the release binary directly. The
      # version is intentionally pinned to v0.8.0 for reproducible smoke-test
      # runs and verified against a pinned SHA-256; bump both together after
      # validating the new CLI version against scripts/smoke-test.sh.
      - name: Install Stellar CLI
        env:
          CLI_URL: https://github.com/stellar/stellar-cli/releases/download/v0.8.0/soroban-cli-0.8.0-x86_64-unknown-linux-gnu
          CLI_SHA256: bb4683b49915415925a45a00c8b6a54389b70acd831738dc45578d26e05dee24
        run: |
          curl -fsSL "$CLI_URL" -o stellar-cli
          echo "$CLI_SHA256  stellar-cli" | sha256sum -c -
          chmod +x stellar-cli
          sudo mv stellar-cli /usr/local/bin/
          stellar-cli version

      - name: Run smoke test script
        env:
          ATT_REGISTRY: ${{ inputs.att_registry }}
          ATTESTER_REGISTRY: ${{ inputs.attester_registry }}
          NETWORK_URL: ${{ inputs.network_url }}
          ADMIN_SECRET: ${{ secrets.TESTNET_DEPLOYER_SECRET }}
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh
