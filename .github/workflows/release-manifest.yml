name: Release

# Tag pipeline (docs/releasing.md#automated-release-flow): reproducible wasm ->
# SHA256SUMS -> provenance metadata and wasm policy assertions -> release
# manifest (generated + validated + checked against SHA256SUMS) -> bindings ->
# signed SLSA build provenance -> GitHub release -> follow-up PR adding the
# wasm to the upgrade-compatibility fixtures.
#
# Triggers:
#   - workflow_call from release-please.yml after a release PR merges (a tag
#     created with GITHUB_TOKEN doesn't fire `push: tags` itself);
#   - `push: tags` for a tag pushed by hand;
#   - workflow_dispatch, dry-run by default, on any branch: builds the full
#     artifact set and uploads it as a workflow artifact, publishes nothing.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and upload artifacts only; no attestation, release, or fixtures PR"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}

jobs:
  release:
    name: Build, attest, and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # Start in audit mode; switch to `block` with an allowed-endpoints
          # list once the egress baseline from audit runs is reviewed.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Reproducible contract wasm (pinned container)
        run: make wasm-reproducible

      - name: Assert provenance metadata in every wasm
        run: python3 scripts/check_wasm_meta.py --require-all --commit "$(git rev-parse HEAD)" target/wasm32v1-none/release/*.wasm

      - name: Assert wasm policy (host imports, instructions, size)
        run: python3 scripts/check_wasm_policy.py --markdown "$GITHUB_STEP_SUMMARY" target/wasm32v1-none/release/*.wasm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.lock

      - uses: anchore/sbom-action/download-syft@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          syft-version: v1.53.0

      # One CycloneDX SBOM per contract wasm, the CLI, every npm package and
      # the indexer image, plus the VEX document, all as release assets.
      - name: Generate + validate SBOMs and VEX
        run: |
          mkdir -p dist
          cargo build --release --locked -p lafiya-cli
          python3 scripts/generate_sboms.py -o dist
          for pkg in packages/*/; do
            name=$(basename "$pkg")
            syft scan "dir:$pkg" --source-name "$name" -o "cyclonedx-json@1.6=dist/npm-$name.sbom.cdx.json"
          done
          docker build -f crates/lafiya-indexer/Dockerfile -t lafiya-indexer:"$TAG" .
          syft scan "docker:lafiya-indexer:$TAG" --source-name lafiya-indexer \
            -o "cyclonedx-json@1.6=dist/image-lafiya-indexer.sbom.cdx.json"
          cp security/vex/vex.cdx.json dist/vex.cdx.json
          python3 scripts/validate_sboms.py --vex dist/vex.cdx.json dist/*.sbom.cdx.json

      - name: Generate + validate release manifest
        run: |
          python3 scripts/generate_release_manifest.py --pretty \
            --sbom-dir dist --vex dist/vex.cdx.json -o release-manifest.json
          cp release-manifest.json dist/release-manifest.json
          python3 scripts/validate_release_manifest.py dist/release-manifest.json
          python3 scripts/check_manifest_compatibility.py \
            release-manifest.json \
            docs/release-manifest/examples/lafiya-web.requirements.json

      - name: Assert incentive-pool artifact in release manifest
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("release-manifest.json", encoding="utf-8") as fh:
              manifest = json.load(fh)

          artifacts = manifest.get("artifacts", manifest.get("contracts", []))
          names = {
              a.get("name") or a.get("contract") or a.get("id")
              for a in artifacts
              if isinstance(a, dict)
          }
          if "incentive-pool" not in names:
              sys.exit(
                  "release manifest is missing the incentive-pool artifact; "
                  f"found: {sorted(n for n in names if n)}"
              )
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ env.TAG }}
          path: dist/

      - name: Publish GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(ls dist/* | grep -v RELEASE_NOTES.md)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $assets --clobber
            gh release view "$TAG" --json body -q .body > body.md
            printf '\n\n' >> body.md && cat dist/RELEASE_NOTES.md >> body.md
            gh release edit "$TAG" --notes-file body.md
          else
            gh release create "$TAG" $assets --title "$TAG" --notes-file dist/RELEASE_NOTES.md --verify-tag
          fi

      - name: Open PR adding wasm to upgrade-compatibility fixtures
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="chore/upgrade-fixtures-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main && git switch -c "$branch" origin/main
          mkdir -p "tests/fixtures/upgrade-compat/$TAG"
          cp dist/*.wasm dist/SHA256SUMS "tests/fixtures/upgrade-compat/$TAG/"
          git add tests/fixtures/upgrade-compat
          git commit -m "chore(fixtures): add $TAG wasm to upgrade-compatibility fixtures"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(fixtures): add $TAG wasm to upgrade-compatibility fixtures" \
            --body "Automated follow-up to the $TAG release: the released wasm (see SHA256SUMS) as the \`previous\` side of future upgrade-compatibility tests."
