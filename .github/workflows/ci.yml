name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  shell-lint:
    name: Shell lint (smoke-test.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check (bash -n)
        run: |
          bash -n scripts/smoke-test.sh
          bash -n scripts/smoke-test.test.sh
      - name: ShellCheck
        run: shellcheck scripts/smoke-test.sh scripts/smoke-test.test.sh
      - name: Run smoke-test.sh regression test
        run: bash scripts/smoke-test.test.sh

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --all-features --locked

  build-wasm:
    name: Build (wasm32v1-none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      # Only the Soroban contract crates target wasm32v1-none; the other
      # workspace members (lafiya-cli, lafiya-config, lafiya-commitment) are
      # std binaries/libs that can't build for this no_std-only target.
      - name: Build contract crates
        run: cargo build --release --locked --target wasm32v1-none -p multisig-account -p attester-registry -p attestation-registry
      - name: Check README contract tables
        run: python .github/scripts/check_readme_contracts.py

  fuzz:
    name: Fuzz (proptest, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked fuzz_test -- --nocapture
        env:
          PROPTEST_CASES: 256

  lrc1-cross-language:
    name: LRC-1 cross-language determinism (Rust + TypeScript + Python + random)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ── Rust ──────────────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rust – LRC-1 vector tests
        run: cargo test -p lafiya-commitment --locked

      # ── TypeScript ────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          # Node 22+ supports --experimental-strip-types natively (no build step).
          node-version: "22"
      - name: TypeScript – LRC-1 vector tests
        run: node --experimental-strip-types crates/lafiya-commitment/reference-ts/lrc1.test.ts

      # ── Python ────────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python – LRC-1 vector tests + 10k random cross-check
        run: |
          python crates/lafiya-commitment/reference-py/lrc1_test.py \
            --random-count 10000
