name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned stellar-cli used by the conformance job. Its `contract info
  # interface` JSON shape must match scripts/conformance/snapshots/.
  STELLAR_CLI_VERSION: "25.2.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      indexer: ${{ steps.filter.outputs.indexer }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'contracts/**'
              - 'crates/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.config/nextest.toml'
              - '.github/workflows/ci.yml'
            indexer:
              - 'crates/lafiya-indexer/**'
              - 'deploy/observability/**'
              - 'docs/compliance/**'
              - 'docs/observability.md'
              - 'docs/runbooks/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  shell-lint:
    name: Shell lint (smoke-test.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Syntax check (bash -n)
        run: |
          bash -n scripts/smoke-test.sh
          bash -n scripts/smoke-test.test.sh
      - name: ShellCheck
        run: shellcheck scripts/smoke-test.sh scripts/smoke-test.test.sh
      - name: Run smoke-test.sh regression test
        run: bash scripts/smoke-test.test.sh

  dashboard:
    name: Dashboard generator + reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Includes the reproducibility check: regenerates the site from the
      # pinned synthetic ledger range and compares it with the committed output.
      - run: python -m unittest discover -s dashboard -v
      - run: git diff --exit-code dashboard/fixtures

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Build once, test many: compile every test binary a single time and fan
  # the archive out to partitioned test jobs. The only workspace feature is
  # `testutils`, which the test builds already enable, so one --all-features
  # build replaces the former default + --all-features double run.
  build-tests:
    name: Build test archive
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest archive --workspace --all-features --locked --archive-file nextest-archive.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1

  test:
    name: Test (partition ${{ matrix.partition }}/2)
    needs: build-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - run: >-
          cargo nextest run --profile ci
          --archive-file nextest-archive.tar.zst
          --workspace-remap .
          --partition count:${{ matrix.partition }}/2
          -E 'not test(fuzz_test)'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-test-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml

  fuzz:
    name: Fuzz (proptest, non-blocking)
    needs: build-tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - run: >-
          cargo nextest run --profile ci
          --archive-file nextest-archive.tar.zst
          --workspace-remap .
          -E 'test(fuzz_test)' --no-capture
        env:
          PROPTEST_CASES: 256

  test-report:
    name: Test report
    needs: test
    if: always() && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-test-*
          path: junit
      - uses: dorny/test-reporter@v1
        # Fork PRs get a read-only token; the JUnit artifacts are still uploaded.
        continue-on-error: true
        with:
          name: Test results
          path: junit/**/junit.xml
          reporter: java-junit

  # First-class workspace members: lafiya-indexer and lafiya-qr are built,
  # linted, and tested on every PR so they cannot rot or drift from shared
  # dependency versions.
  crates-build:
    name: Crates build (indexer, qr)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p lafiya-indexer -p lafiya-qr

  crates-clippy:
    name: Crates clippy (indexer, qr)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p lafiya-indexer -p lafiya-qr --all-targets -- -D warnings

  crates-test:
    name: Crates test (indexer e2e, qr)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lafiya
          POSTGRES_PASSWORD: lafiya
          POSTGRES_DB: lafiya_indexer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lafiya"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://lafiya:lafiya@localhost:5432/lafiya_indexer_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test lafiya-qr
        run: cargo test --locked -p lafiya-qr
      - name: Test lafiya-indexer (includes Postgres e2e)
        run: cargo test --locked -p lafiya-indexer --all-targets

  crates-deny:
    name: Cargo deny
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  # Drift gate for the incentive-pool bindings: regenerate from the contract
  # interface and fail if the committed bindings differ.
  bindings-drift:
    name: Bindings drift (incentive-pool)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install stellar-cli
        run: |
          curl -sSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          stellar --version
      - name: Regenerate bindings
        run: bash scripts/generate_bindings.sh
      - name: Fail on drift
        run: git diff --exit-code bindings/

  build-wasm:
    name: Build (wasm32v1-none)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Only the Soroban contract crates target wasm32v1-none; the other
      # workspace members (lafiya-cli, lafiya-config, lafiya-commitment) are
      # std binaries/libs that can't build for this no_std-only target.
      - name: Build contract crates
        run: cargo build --release --locked --target wasm32v1-none -p multisig-account -p attester-registry -p attestation-registry
      # Reused by downstream integration/differential/budget jobs instead of
      # rebuilding the contracts.
      - uses: actions/upload-artifact@v7
        with:
          name: release-wasm
          path: target/wasm32v1-none/release/*.wasm
          retention-days: 7

  # Builds the shared QR codec for the browser verifier and enforces the
  # bundle size budget. The budget lives in the SDK package so PRs that
  # regress it fail here.
  build-qr-wasm:
    name: Build (lafiya-qr wasm32-unknown-unknown)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build lafiya-qr for wasm32-unknown-unknown
        run: cargo build --release --locked --target wasm32-unknown-unknown -p lafiya-qr
      - name: Report bundle size and enforce budget
        run: python3 packages/verifier-sdk/scripts/check_wasm_budget.py \
          --wasm target/wasm32-unknown-unknown/release/lafiya_qr.wasm \
          --budget packages/verifier-sdk/wasm-size-budget.json
      - uses: actions/upload-artifact@v4
        with:
          name: lafiya-qr-wasm
          path: target/wasm32-unknown-unknown/release/lafiya_qr.wasm
          retention-days: 7

  # Runs the shared vector suite against both the Rust codec (via the WASM
  # artifact) and the TypeScript codec until the latter is retired.
  qr-vector-parity:
    name: QR vector parity (Rust vs TypeScript)
    needs: [changes, build-qr-wasm]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: lafiya-qr-wasm
          path: target/wasm32-unknown-unknown/release
      - name: Install SDK dependencies
        working-directory: packages/verifier-sdk
        run: npm ci
      - name: Run shared vector suite against both codecs
        working-directory: packages/verifier-sdk
        run: npm run test:qr-vectors

  docs-checks:
    name: Docs & catalog checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check README contract tables
        run: python .github/scripts/check_readme_contracts.py
      - name: Check README versions match Cargo.toml
        run: python .github/scripts/check_readme_versions.py
      - name: Check error/event catalogs are regenerated
        run: python3 scripts/conformance/gen_catalog.py --check
      - name: Run the verification-model truth table
        run: python3 scripts/verification_model.py

  # Fraud-scoring calibration gate. Runs the seeded simulator on the reduced
  # dataset and fails if recall at the fixed FPR operating point drops below
  # the floor documented in docs/runbooks/attester-fraud-response.md.
  fraud-scoring-eval:
    name: Fraud scoring evaluation (reduced, seeded)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run seeded evaluation on reduced dataset
        run: >-
          cargo run --locked -p lafiya-fraud-scoring --bin fraud-scoring-eval --
          --dataset reduced
          --seed 0
          --fixed-fpr 0.05
          --min-recall 0.80
          --report target/fraud-scoring/report.json
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fraud-scoring-report
          path: target/fraud-scoring/report.json
          retention-days: 7

  # QR physical-robustness harness. Regenerates the seeded degradation corpus
  # and fails if the committed data under docs/specs/ is stale.
  qr-robustness:
    name: QR robustness harness (seeded)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Regenerate seeded degradation corpus
        run: >-
          cargo run --locked -p lafiya-qr --bin qr-robustness --
          --seed 0
          --out docs/specs/qr-robustness-data.json
      - name: Verify committed data is reproducible
        run: git diff --exit-code docs/specs/qr-robustness-data.json

  # Single required check for branch protection. Jobs skipped by the path
  # filter count as success; any failure or cancellation fails this job.
  ci-success:
    name: ci-success
    if: always()
    needs: [shell-lint, changes, fmt, clippy, build-tests, test, test-report, crates-build, crates-clippy, crates-test, crates-deny, bindings-drift, build-wasm, docs-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
