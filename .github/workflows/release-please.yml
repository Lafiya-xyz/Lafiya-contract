name: Release PR

# Maintains the "chore(main): release X.Y.Z" PR from Conventional Commits
# (release-please-config.json). Merging it tags the release and runs the tag
# pipeline in release-manifest.yml. See docs/releasing.md.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-manifest.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
