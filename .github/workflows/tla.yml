name: TLA+ Model Check

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "verification/tla/**"
      - "contracts/**"
      - ".github/workflows/tla.yml"

jobs:
  tlc:
    name: TLC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Model-check specs (tla2tools pinned in run.sh)
        run: verification/tla/run.sh

  trace-validation:
    name: Trace Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Regenerate trace corpus from instrumented Rust tests
        run: verification/tla/gen-traces.sh
      - name: Validate traces against AttestationLifecycle spec
        run: verification/tla/run-trace-validation.sh
      - name: Upload trace corpus and validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tla-trace-corpus
          path: |
            verification/tla/traces/**
            verification/tla/out/trace-validation/**
          if-no-files-found: warn