name: Setup stellar-cli
description: >-
  Install the pinned stellar-cli release. The version pin lives here only;
  its `contract info interface` JSON shape must match
  scripts/conformance/snapshots/.

inputs:
  version:
    description: stellar-cli release version (without the leading v).
    required: false
    default: "25.2.0"

runs:
  using: composite
  steps:
    - name: Install stellar-cli
      shell: bash
      env:
        STELLAR_CLI_VERSION: ${{ inputs.version }}
      run: |
        curl -sSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
          | tar -xz -C /usr/local/bin stellar
        stellar --version
